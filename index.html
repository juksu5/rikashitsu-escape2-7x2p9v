<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="robots" content="noindex,nofollow">
    <title>理科室の掟 2：修正版</title>
    <style>
        body { background-color: #000; color: #eee; text-align: center; font-family: serif; margin: 0; overflow: hidden; touch-action: none; }
        
        #game-outer { width: 100vw; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #game-container { 
            width: 800px; height: 500px; position: relative;
            background: #222 url('assets/bg_lab.jpg') no-repeat center/cover;
            border: 5px solid #333; overflow: hidden; display: none;
            touch-action: none;
        }

        @media (max-width: 820px) {
            #game-container { transform: scale(0.45); transform-origin: center; }
            #status-bar { font-size: 36px !important; }
        }
        
        /* ゲート画面とボタンの改善 */
        #gate-screen { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #111; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; z-index: 1000; 
        }
        #pass-display { font-size: 40px; letter-spacing: 10px; margin: 10px; min-height: 50px; color: #fff; }
        
        .numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .numpad button { width: 70px; height: 70px; font-size: 28px; background: #333; color: #fff; border: 2px solid #555; border-radius: 10px; }

        /* 入室ボタンの改善（白地・黒文字・大きく） */
        #enter-btn { 
            margin-top: 30px; padding: 20px 80px; font-size: 32px; font-weight: bold;
            background: #fff; color: #000; border: none; border-radius: 15px; cursor: pointer;
        }

        #enemy { position: absolute; top: 50px; left: 320px; font-size: 100px; transition: 0.5s; z-index: 5; opacity: 0; pointer-events: none; }
        .item { position: absolute; user-select: none; z-index: 20; }
        #lamp { bottom: 60px; left: 340px; width: 120px; }
        #matchbox { bottom: 50px; right: 50px; width: 140px; }
        #hand-item { position: absolute; pointer-events: none; z-index: 100; width: 100px; display: none; transform: translate(-50%, -50%); }
        #status-bar { font-size: 24px; color: #ff3333; margin: 10px; font-weight: bold; min-height: 40px; }
        #timer { position: absolute; top: 10px; right: 25px; font-size: 28px; color: #fff; z-index: 30; }
    </style>
</head>
<body>

    <div id="gate-screen">
        <h1 style="color:#f00;">理科室脱出 2</h1>
        <div id="pass-display"></div>
        <div class="numpad">
            <button onclick="addNum('1')">1</button><button onclick="addNum('2')">2</button><button onclick="addNum('3')">3</button>
            <button onclick="addNum('4')">4</button><button onclick="addNum('5')">5</button><button onclick="addNum('6')">6</button>
            <button onclick="addNum('7')">7</button><button onclick="addNum('8')">8</button><button onclick="addNum('9')">9</button>
            <button onclick="addNum('0')">0</button>
            <button onclick="clearPass()" style="grid-column: span 2; background:#900;">消去</button>
        </div>
        <button id="enter-btn" onclick="checkPass()">入室</button>
        <p id="error-msg" style="color:red; margin-top:20px; font-size:20px;"></p>
    </div>

    <div id="game-outer">
        <div id="status-bar"></div>
        <div id="game-container">
            <div id="timer">TIME: 30</div>
            <div id="enemy">💀</div>
            <img id="lamp" class="item" src="assets/lamp_close.png">
            <img id="matchbox" class="item" src="assets/matchbox.png">
            <img id="hand-item" src="">
        </div>
    </div>

    <script>
        const PASSWORD = "103";
        let currentPass = "";
        const bgm = new Audio('assets/bgm_horror.mp3');
        const seScratch = new Audio('assets/se_match.mp3');
        const seIgnite = new Audio('assets/se_ignite.mp3');
        const seGameOver = new Audio('assets/se_gameover.mp3'); 
        const seSuccess = new Audio('assets/se_success.mp3'); 

        let step = 0; 
        let timeLeft = 30;
        let lastX = 0, lastY = 0;
        let gameOver = false;
        let timerId;
        
        // スライド検知フラグ
        let enteredSide = false;

        function addNum(n) { currentPass += n; updatePassDisplay(); }
        function clearPass() { currentPass = ""; updatePassDisplay(); }
        function updatePassDisplay() { document.getElementById('pass-display').innerText = currentPass.replace(/./g, '●'); }

        function checkPass() {
            if (currentPass === PASSWORD) {
                document.getElementById('gate-screen').style.display = 'none';
                document.getElementById('game-container').style.display = 'block';
                [bgm, seScratch, seIgnite, seGameOver, seSuccess].forEach(s => s.load());
                bgm.loop = true; bgm.play().catch(() => {});
                startGame();
            } else {
                document.getElementById('error-msg').innerText = "合言葉がちがう...";
                clearPass();
            }
        }

        function startGame() {
            updateStatus("ランプをクリックして、ふたを取ろう");
            timerId = setInterval(updateTimer, 1000);
            const container = document.getElementById('game-container');
            container.addEventListener('mousemove', handleMove);
            container.addEventListener('touchmove', (e) => { e.preventDefault(); handleMove(e.touches[0]); }, { passive: false });
            
            // ランプのクリック/タップ
            const lampEl = document.getElementById('lamp');
            const handleLampAction = (e) => { e.preventDefault(); clickLamp(); };
            lampEl.addEventListener('mousedown', handleLampAction);
            lampEl.addEventListener('touchstart', handleLampAction);
        }

        function handleMove(e) {
            if (gameOver) return;
            const container = document.getElementById('game-container');
            const hand = document.getElementById('hand-item');
            const rect = container.getBoundingClientRect();
            const scale = rect.width / 800;
            const x = (e.clientX - rect.left) / scale;
            const y = (e.clientY - rect.top) / scale;

            hand.style.left = x + "px";
            hand.style.top = y + "px";

            // ステップ1: マッチを擦る（箱の右端で下から上へスライド）
            if (step === 1) {
                if (x > 750 && x < 850 && y > 350 && y < 500) { enteredSide = true; } 
                if (enteredSide && x > 750 && y < 350) { 
                    step = 2; enteredSide = false;
                    seScratch.play();
                    hand.src = "assets/match_fire.png";
                    updateStatus("火がついた！芯をクリックして点火！");
                }
            }
            
            // ステップ3: 消火（ランプの横から芯へスライド）
            if (step === 3) {
                // ランプの真横（左右どちらか）を通ったか
                if ((x < 300 || x > 500) && (y > 300 && y < 450)) { enteredSide = true; }
                
                // 横を通った後に、芯（中央付近）に重なったら成功
                if (enteredSide && x > 380 && x < 420 && y > 300 && y < 400) {
                    step = 4; enteredSide = false;
                    document.getElementById('lamp').src = "assets/lamp_close.png";
                    hand.style.display = "none";
                    endGame("完璧な作法だ。脱出成功！", true);
                }
            }
            lastX = x; lastY = y;
        }

        function clickLamp() {
            if (gameOver) return;
            if (step === 0) {
                step = 1; enteredSide = false;
                document.getElementById('lamp').src = "assets/lamp_open.png";
                showHandItem("assets/match_stick.png");
                updateStatus("マッチ箱の右端を、下から上へシュッ！");
            } else if (step === 2) {
                step = 3; enteredSide = false;
                seIgnite.play();
                document.getElementById('lamp').src = "assets/lamp_fire.png";
                showHandItem("assets/lamp_cap.png");
                updateStatus("ふたを「ランプの外」から横にスライド！");
            }
        }

        function showHandItem(src) {
            const hand = document.getElementById('hand-item');
            hand.src = src; hand.style.display = "block";
        }

        function updateStatus(msg) { document.getElementById('status-bar').innerText = msg; }

        function updateTimer() {
            if (gameOver) return;
            timeLeft--;
            document.getElementById('timer').innerText = "TIME: " + timeLeft;
            const enemy = document.getElementById('enemy');
            enemy.style.opacity = (30 - timeLeft) / 20;
            enemy.style.transform = `scale(${1 + (30 - timeLeft) * 0.9})`;
            if (timeLeft <= 0) endGame("標本が追いついた...", false);
        }

        function endGame(msg, success) {
            if (gameOver) return;
            gameOver = true;
            clearInterval(timerId);
            bgm.pause();
            if (success) { seSuccess.play(); } else { seGameOver.play(); }
            setTimeout(() => { alert(msg); location.reload(); }, 500);
        }
    </script>
</body>
</html>
